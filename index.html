<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Image Editor</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <header>
        <h1>Advanced Image Editor</h1>
        <p>Upload images, click a thumbnail to edit, and download your results.</p>
    </header>

    <div class="main-container">
        <!-- Left Column: Galleries -->
        <div class="gallery-column">
            <div class="upload-section">
                <label for="image-input" class="custom-file-upload">Choose Files</label>
                <input type="file" id="image-input" accept="image/jpeg,image/jpg" multiple>
            </div>

            <h2>Uploaded Images</h2>
            <div id="gallery" class="gallery-container"></div>

            <h2>Processed Images</h2>
            <div id="results" class="gallery-container"></div>

            <button id="download-button" style="display:none;">Download All as ZIP</button>
        </div>

        <!-- Right Column: Editor -->
        <div class="editor-column">
            <h2>Editor</h2>
            <div id="editor-container">
                <div id="tools">
                    <button id="tool-eyedropper" class="tool-btn" title="Eyedropper"></button>
                    <button id="tool-magic-wand" class="tool-btn active" title="Magic Wand"></button>
                    <button id="tool-brush" class="tool-btn" title="Brush"></button>
                    <input type="range" id="brush-size" min="1" max="50" value="10" title="Brush Size">

                    <label for="color-swatch">Color:</label>
                    <div id="color-swatch" style="width: 25px; height: 25px; border: 1px solid #ccc; background-color: #0000ff;"></div>

                    <div class="mode-switcher">
                        <button id="mode-add" class="mode-btn active" title="Add to Selection">Add</button>
                        <button id="mode-subtract" class="mode-btn" title="Subtract from Selection">Subtract</button>
                    </div>
                </div>
                <canvas id="editor-canvas"></canvas>
                <div class="editor-actions">
                    <button id="save-changes-button">Apply & Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
